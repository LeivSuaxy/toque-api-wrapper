{{define "head"}}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · toque api</title>
  <link rel="stylesheet" href="/admin/static/app.css">
</head>
<body>
{{end}}

{{define "foot"}}
  <script src="/admin/static/app.js" defer></script>
</body>
</html>
{{end}}

{{define "nav"}}
<header class="topbar">
  <div class="brand"><span>toque</span> api</div>
  <div class="nav-right">
    <span class="muted">{{.Username}}</span>
    <form method="post" action="/admin/logout" class="inline">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button type="submit" class="ghost">Salir</button>
    </form>
  </div>
</header>
{{end}}

{{define "usage_card"}}
<div class="card stat">
  <span class="muted">{{.Label}}</span>
  <strong>{{.Usage.Requests}}</strong>
  <span class="muted">peticiones</span>
  <div class="stat-row">
    <span>req {{humanBytes .Usage.RequestBytes}}</span>
    <span>res {{humanBytes .Usage.ResponseBytes}}</span>
  </div>
</div>
{{end}}
